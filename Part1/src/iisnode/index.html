<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"DESKTOP-B4H2240-10548-stderr-1788109886309.txt","computername":"DESKTOP-B4H2240","pid":10548,"type":"stderr","created":1788109886309},{"file":"DESKTOP-B4H2240-10548-stdout-1788109886308.txt","computername":"DESKTOP-B4H2240","pid":10548,"type":"stdout","created":1788109886308},{"file":"DESKTOP-B4H2240-10860-stderr-1788107140232.txt","computername":"DESKTOP-B4H2240","pid":10860,"type":"stderr","created":1788107140232},{"file":"DESKTOP-B4H2240-10860-stdout-1788107140231.txt","computername":"DESKTOP-B4H2240","pid":10860,"type":"stdout","created":1788107140231},{"file":"DESKTOP-B4H2240-8920-stderr-1788107269485.txt","computername":"DESKTOP-B4H2240","pid":8920,"type":"stderr","created":1788107269485},{"file":"DESKTOP-B4H2240-8920-stdout-1788107269484.txt","computername":"DESKTOP-B4H2240","pid":8920,"type":"stdout","created":1788107269484}];
        var lastUpdated = 1788109886377;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
